[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "nexora"
version = "0.1.0.dev0"
description = "Elegant virtual infrastructure management."
readme = "README.md"
requires-python = ">=3.12,<3.15"
license = { file = "LICENSE" }
authors = [{ name = "Nexora contributors" }]
dependencies = [
  "alembic>=1.16,<2",
  "asyncssh[bcrypt]>=2.22,<3",
  "cryptography>=46,<47",
  "fastapi>=0.116,<1",
  "jinja2>=3.1,<4",
  "lxml>=6.0,<7",
  "pwdlib[argon2]>=0.3,<1",
  "pydantic-settings>=2.10,<3",
  "python-multipart>=0.0.20,<1",
  "sqlalchemy>=2.0,<3",
  "uvicorn[standard]>=0.35,<1",
  "websockets>=16,<17",
]

[project.scripts]
nexora-ops = "nexora.operations.cli:main"

[dependency-groups]
dev = [
  "httpx2>=2,<3",
  "lxml-stubs>=0.5,<1",
  "mypy>=1.17,<2",
  "pytest>=8.4,<9",
  "pytest-cov>=6.2,<7",
  "ruff>=0.12,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/nexora"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["nexora"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["SIM300"]
allowed-confusables = ["，"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["nexora"]
